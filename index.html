<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="El Show de Dario Alejandro - música, eventos, contrataciones y videos.">
  <meta name="theme-color" content="#050816">
  <title>El Show de Dario Alejandro</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #030613;
      --panel: #070b1b;
      --yellow: #ffd21a;
      --gold: #ff9d00;
      --white: #fff;
      --cyan: #00eaff;
      --pink: #ff18d4;
      --blue: #176cff;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #fff;
      background:
        radial-gradient(circle at 10% 15%, rgba(0, 234, 255, .18), transparent 24%),
        radial-gradient(circle at 90% 28%, rgba(255, 24, 212, .13), transparent 25%),
        linear-gradient(135deg, #02040c, #050918 50%, #03040b);
      font-family: Montserrat, Arial, sans-serif;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: radial-gradient(circle, rgba(255, 255, 255, .7) 1px, transparent 1px);
      background-size: 70px 70px;
    }

    .site {
      width: min(1120px, 94%);
      margin: 0 auto;
      padding: 18px 0 34px;
      position: relative;
      z-index: 1;
    }

    .hero {
      min-height: 300px;
      border: 1px solid rgba(255, 204, 0, .35);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 50px 20px 35px;
      background:
        radial-gradient(circle at 15% 35%, rgba(255, 146, 0, .85), transparent 14%),
        radial-gradient(circle at 84% 25%, rgba(0, 92, 255, .9), transparent 20%),
        radial-gradient(circle at 50% 80%, rgba(0, 170, 255, .32), transparent 25%),
        linear-gradient(120deg, #07080d, #061d45 45%, #10050f);
      box-shadow: 0 0 35px rgba(0, 130, 255, .18), inset 0 0 50px rgba(0, 0, 0, .6);
    }

    .hero:after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 34%;
      background: linear-gradient(transparent, rgba(0, 0, 0, .72));
    }

    .hero-lights {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(110deg, transparent 30%, rgba(255, 220, 60, .24) 31%, transparent 34%),
        linear-gradient(70deg, transparent 63%, rgba(0, 180, 255, .24) 64%, transparent 67%);
      filter: blur(2px);
    }

    .music-notes {
      position: absolute;
      inset: 12px 25px auto;
      display: flex;
      justify-content: space-between;
      font-size: 55px;
      color: #ffd21a;
      text-shadow: 0 0 16px #ff8a00;
      transform: rotate(-4deg);
    }

    .crown {
      position: relative;
      z-index: 2;
      color: #ffd21a;
      font-size: 48px;
      line-height: 1;
      text-shadow: 0 0 12px #ff9d00;
    }

    .hero-kicker {
      position: relative;
      z-index: 2;
      margin: 2px 0 -5px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(38px, 6vw, 66px);
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 3px 4px 0 #111, 0 0 12px #fff;
    }

    .hero h1 {
      position: relative;
      z-index: 2;
      margin: 0;
      font-family: Anton, 'Arial Narrow', sans-serif;
      font-size: clamp(55px, 10vw, 112px);
      line-height: .95;
      letter-spacing: 2px;
      font-style: italic;
      color: #ffb300;
      -webkit-text-stroke: 2px #fff;
      text-shadow: 4px 6px 0 #080808, 0 0 12px #ffae00, 0 0 30px rgba(255, 174, 0, .55);
    }

    .hero-subtitle {
      position: relative;
      z-index: 2;
      margin: 15px 0 0;
      font-weight: 800;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .neon-panel {
      margin-top: 28px;
      padding: 22px 25px 28px;
      text-align: center;
      border: 1px solid rgba(0, 234, 255, .35);
      border-radius: 4px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 100%, rgba(255, 0, 220, .22), transparent 40%),
        linear-gradient(110deg, #07142c, #090419 48%, #230020);
      box-shadow: 0 0 25px rgba(255, 0, 200, .13), inset 0 0 28px rgba(0, 150, 255, .08);
      position: relative;
    }

    .equalizer {
      height: 35px;
      display: flex;
      gap: 7px;
      justify-content: center;
      align-items: flex-end;
      opacity: .65;
    }

    .equalizer span {
      width: 8px;
      border-radius: 3px 3px 0 0;
      height: 18px;
      background: linear-gradient(#00eaff, #ff19d5);
      box-shadow: 0 0 10px #00eaff;
      animation: equalize 0.8s ease-in-out infinite alternate;
    }

    .equalizer span:nth-child(2n) { animation-delay: 0.1s; }
    .equalizer span:nth-child(3n) { animation-delay: 0.2s; }
    .equalizer span:nth-child(4n) { animation-delay: 0.3s; }

    @keyframes equalize {
      from { transform: scaleY(.4); opacity: .5; }
      to { transform: scaleY(1.2); opacity: 1; }
    }

    .booking h2, .videos h2 {
      margin: 0;
      font-family: Anton, 'Arial Narrow', sans-serif;
      font-style: italic;
      font-size: clamp(36px, 5vw, 60px);
      letter-spacing: 2px;
      color: var(--yellow);
      text-shadow: 4px 4px 0 #111, 0 0 14px rgba(255, 191, 0, .6);
    }

    .phones {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 24px;
      margin-top: 10px;
    }

    .phone {
      color: #fff;
      text-decoration: none;
      font-family: Anton, Arial, sans-serif;
      font-size: clamp(27px, 4vw, 45px);
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 3px 3px 0 #111;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .phone:hover { color: #ffd21a; }

    .wa {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: #fff;
      background: #1fca5a;
      border: 3px solid #fff;
      font-size: 22px;
      font-family: Arial, sans-serif;
      font-style: normal;
    }

    .or {
      font-weight: 800;
      font-style: italic;
      color: var(--yellow);
      font-size: 22px;
    }

    .videos { padding-top: 22px; }
    .videos h2 {
      text-align: center;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 255, 255, .3);
      font-family: 'Bebas Neue', sans-serif;
      font-style: normal;
      letter-spacing: 3px;
    }

    .video-grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .video-card {
      background: #050713;
      border: 1px solid rgba(255, 255, 255, .13);
      padding: 7px;
      box-shadow: 0 0 16px rgba(0, 234, 255, .08);
      position: relative;
    }

    .video-frame {
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #000;
    }

    .video-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .socials {
      margin-top: 28px;
      padding: 22px 28px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 25px;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, .18);
      border
