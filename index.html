<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="El Show de Dario Alejandro - música, eventos, contrataciones y videos.">
  <meta name="theme-color" content="#050816">
  <title>El Show de Dario Alejandro</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #030613;
      --panel: #070b1b;
      --yellow: #ffd21a;
      --gold: #ff9d00;
      --white: #fff;
      --cyan: #00eaff;
      --pink: #ff18d4;
      --blue: #176cff;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #fff;
      background:
        radial-gradient(circle at 10% 15%, rgba(0, 234, 255, .18), transparent 24%),
        radial-gradient(circle at 90% 28%, rgba(255, 24, 212, .13), transparent 25%),
        linear-gradient(135deg, #02040c, #050918 50%, #03040b);
      font-family: Montserrat, Arial, sans-serif;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: radial-gradient(circle, rgba(255, 255, 255, .7) 1px, transparent 1px);
      background-size: 70px 70px;
    }

    .site {
      width: min(1120px, 94%);
      margin: 0 auto;
      padding: 18px 0 34px;
      position: relative;
      z-index: 1;
    }

    .hero {
      min-height: 300px;
      border: 1px solid rgba(255, 204, 0, .35);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 50px 20px 35px;
      background:
        radial-gradient(circle at 15% 35%, rgba(255, 146, 0, .85), transparent 14%),
        radial-gradient(circle at 84% 25%, rgba(0, 92, 255, .9), transparent 20%),
        radial-gradient(circle at 50% 80%, rgba(0, 170, 255, .32), transparent 25%),
        linear-gradient(120deg, #07080d, #061d45 45%, #10050f);
      box-shadow: 0 0 35px rgba(0, 130, 255, .18), inset 0 0 50px rgba(0, 0, 0, .6);
    }

    .hero:after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 34%;
      background: linear-gradient(transparent, rgba(0, 0, 0, .72));
    }

    .hero-lights {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(110deg, transparent 30%, rgba(255, 220, 60, .24) 31%, transparent 34%),
        linear-gradient(70deg, transparent 63%, rgba(0, 180, 255, .24) 64%, transparent 67%);
      filter: blur(2px);
    }

    .music-notes {
      position: absolute;
      inset: 12px 25px auto;
      display: flex;
      justify-content: space-between;
      font-size: 55px;
      color: #ffd21a;
      text-shadow: 0 0 16px #ff8a00;
      transform: rotate(-4deg);
    }

    .crown {
      position: relative;
      z-index: 2;
      color: #ffd21a;
      font-size: 48px;
      line-height: 1;
      text-shadow: 0 0 12px #ff9d00;
    }

    .hero-kicker {
      position: relative;
      z-index: 2;
      margin: 2px 0 -5px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(38px, 6vw, 66px);
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 3px 4px 0 #111, 0 0 12px #fff;
    }

    .hero h1 {
      position: relative;
      z-index: 2;
      margin: 0;
      font-family: Anton, 'Arial Narrow', sans-serif;
      font-size: clamp(55px, 10vw, 112px);
      line-height: .95;
      letter-spacing: 2px;
      font-style: italic;
      color: #ffb300;
      -webkit-text-stroke: 2px #fff;
      text-shadow: 4px 6px 0 #080808, 0 0 12px #ffae00, 0 0 30px rgba(255, 174, 0, .55);
    }

    .hero-subtitle {
      position: relative;
      z-index: 2;
      margin: 15px 0 0;
      font-weight: 800;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .neon-panel {
      margin-top: 28px;
      padding: 22px 25px 28px;
      text-align: center;
      border: 1px solid rgba(0, 234, 255, .35);
      border-radius: 4px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 100%, rgba(255, 0, 220, .22), transparent 40%),
        linear-gradient(110deg, #07142c, #090419 48%, #230020);
      box-shadow: 0 0 25px rgba(255, 0, 200, .13), inset 0 0 28px rgba(0, 150, 255, .08);
      position: relative;
    }

    .equalizer {
      height: 35px;
      display: flex;
      gap: 7px;
      justify-content: center;
      align-items: flex-end;
      opacity: .65;
    }

    .equalizer span {
      width: 8px;
      border-radius: 3px 3px 0 0;
      height: 18px;
      background: linear-gradient(#00eaff, #ff19d5);
      box-shadow: 0 0 10px #00eaff;
      animation: equalize 0.8s ease-in-out infinite alternate;
    }

    .equalizer span:nth-child(2n) { animation-delay: 0.1s; }
    .equalizer span:nth-child(3n) { animation-delay: 0.2s; }
    .equalizer span:nth-child(4n) { animation-delay: 0.3s; }

    @keyframes equalize {
      from { transform: scaleY(.4); opacity: .5; }
      to { transform: scaleY(1.2); opacity: 1; }
    }

    .booking h2, .videos h2 {
      margin: 0;
      font-family: Anton, 'Arial Narrow', sans-serif;
      font-style: italic;
      font-size: clamp(36px, 5vw, 60px);
      letter-spacing: 2px;
      color: var(--yellow);
      text-shadow: 4px 4px 0 #111, 0 0 14px rgba(255, 191, 0, .6);
    }

    .phones {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 24px;
      margin-top: 10px;
    }

    .phone {
      color: #fff;
      text-decoration: none;
      font-family: Anton, Arial, sans-serif;
      font-size: clamp(27px, 4vw, 45px);
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 3px 3px 0 #111;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .phone:hover { color: #ffd21a; }

    .wa {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: #fff;
      background: #1fca5a;
      border: 3px solid #fff;
      font-size: 22px;
      font-family: Arial, sans-serif;
      font-style: normal;
    }

    .or {
      font-weight: 800;
      font-style: italic;
      color: var(--yellow);
      font-size: 22px;
    }

    .videos { padding-top: 22px; }
    .videos h2 {
      text-align: center;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 255, 255, .3);
      font-family: 'Bebas Neue', sans-serif;
      font-style: normal;
      letter-spacing: 3px;
    }

    .video-grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .video-card {
      background: #050713;
      border: 1px solid rgba(255, 255, 255, .13);
      padding: 7px;
      box-shadow: 0 0 16px rgba(0, 234, 255, .08);
      position: relative;
    }

    .video-frame {
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #000;
    }

    .video-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .socials {
      margin-top: 28px;
      padding: 22px 28px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 25px;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, .18);
      border-bottom: 1px solid rgba(255, 255, 255, .18);
      background: linear-gradient(90deg, rgba(255, 255, 255, .02), rgba(255, 0, 200, .08), rgba(0, 234, 255, .05));
    }

    .social-copy {
      position: relative;
      padding: 15px;
      background: linear-gradient(135deg, #060811, #151026);
      border: 1px solid rgba(255, 206, 0, .18);
      overflow: hidden;
    }

    .social-copy:after {
      content: "";
      position: absolute;
      inset: auto -10% 0 -10%;
      height: 5px;
      background: linear-gradient(90deg, transparent, #ff14c8, #ffd21a, #00eaff, transparent);
      box-shadow: 0 0 14px #ff14c8;
    }

    .social-copy h2 {
      margin: 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(32px, 4vw, 52px);
      line-height: .95;
      font-style: italic;
      letter-spacing: 1px;
    }

    .social-copy strong { color: #ffd21a; }
    .burst { position: absolute; right: 20px; bottom: 8px; color: #ffd21a; font-size: 40px; }

    .social-links {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      align-items: start;
    }

    .social {
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .7px;
    }

    .social .icon {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin: 0 auto 7px;
      border-radius: 18px;
      font-size: 36px;
      font-weight: 900;
      background: #050505;
      border: 2px solid #fff;
      box-shadow: 0 0 18px rgba(255, 255, 255, .12);
    }

    .instagram .icon { border-color: #ff2bd6; box-shadow: 0 0 18px #ff2bd6; }
    .youtube .icon { border-color: #ff1c1c; color: #ff1c1c; box-shadow: 0 0 18px #ff1c1c; }
    .tiktok .icon { border-color: #00eaff; color: #fff; box-shadow: 0 0 18px #00eaff; }
    .social:hover .icon { transform: translateY(-3px) scale(1.04); }

    .handle {
      grid-column: 1/-1;
      display: block;
      padding: 8px 15px;
      border: 2px solid #ffd21a;
      border-radius: 30px;
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(255, 210, 26, .25);
      background: #07080d;
    }

    .handle span { color: #ffd21a; font-size: 26px; }

    footer {
      text-align: center;
      padding-top: 22px;
      color: rgba(255, 255, 255, .6);
      font-size: 12px;
    }

    /* CHAT LATERAL FLOTANTE */
    #chat-toggle {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      background: linear-gradient(135deg, #00eaff, #ff18d4);
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 12px 20px;
      font-family: Montserrat, sans-serif;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 234, 255, .5);
    }

    #chat-sidebar {
      position: fixed;
      top: 0;
      left: -350px;
      width: 320px;
      height: 100vh;
      background: #070b1b;
      border-right: 2px solid #00eaff;
      z-index: 1001;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 15px;
      box-shadow: 5px 0 25px rgba(0, 0, 0, .8);
    }

    #chat-sidebar.open { left: 0; }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .chat-header h3 { margin: 0; color: #ffd21a; font-size: 18px; }
    .close-chat { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .chat-msg {
      background: rgba(255, 255, 255, .05);
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid #ff18d4;
    }

    .chat-msg strong { color: #00eaff; font-size: 13px; display: block; }
    .chat-msg p { margin: 3px 0 0; font-size: 13px; word-break: break-word; }

    .chat-inputs input, .chat-inputs textarea {
      width: 100%;
      background: #02040c;
      border: 1px solid rgba(0, 234, 255, .4);
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-family: inherit;
    }

    .chat-inputs button {
      width: 100%;
      background: #ffd21a;
      color: #000;
      border: none;
      padding: 10px;
      font-weight: 800;
      border-radius: 4px;
      cursor: pointer;
    }

    /* BOTÓN Y MODAL DE ADMIN */
    #admin-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: #07080d;
      color: #ffd21a;
      border: 1px solid #ffd21a;
      border-radius: 30px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .admin-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .85);
      z-index: 2000;
      display: none;
      place-items: center;
      padding: 20px;
    }

    .admin-modal.open { display: grid; }

    .admin-box {
      background: #070b1b;
      border: 2px solid #ffd21a;
      padding: 25px;
      width: min(500px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 8px;
      position: relative;
    }

    .admin-box h2 { color: #ffd21a; margin-top: 0; }
    .admin-box label { display: block; margin: 10px 0 4px; font-size: 12px; font-weight: 700; color: #00eaff; }
    .admin-box input { width: 100%; padding: 8px; background: #02040c; border: 1px solid #333; color: #fff; border-radius: 4px; }
    .admin-box button { margin-top: 15px; width: 100%; padding: 10px; background: #1fca5a; color: #fff; border: none; font-weight: 800; cursor: pointer; }
    .close-admin { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }

    @media (max-width: 800px) {
      .video-grid { grid-template-columns: 1fr; }
      .socials { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .site { width: 96%; }
      .hero { min-height: 250px; padding: 40px 10px 28px; }
      .music-notes { font-size: 35px; }
      .hero-subtitle { letter-spacing: 2px; font-size: 12px; }
      .neon-panel { padding: 18px 10px 22px; }
      .phones { gap: 7px 12px; }
      .phone { font-size: 27px; }
      .wa { width: 34px; height: 34px; font-size: 17px; }
      .social-links { gap: 8px; }
      .social .icon { width: 55px; height: 55px; font-size: 28px; }
      .handle { font-size: 14px; }
    }
  </style>
</head>
